  - entity_id: sensor.thermometer_buro_matthias_temperatur
    trigger: state
  - entity_id: input_number.soll_temperatur
    trigger: state
  - entity_id: input_datetime.heizung_buro_matthias_an
    trigger: state
  - entity_id: input_datetime.heizung_buro_matthias_aus
    trigger: state
  - minutes: /5
    trigger: time_pattern
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: "{{ now() >= today_at(states('input_datetime.heizung_buro_matthias_an'))
          and\n   now() <  today_at(states('input_datetime.heizung_buro_matthias_aus'))
          }}\n"
      sequence:
      - choose:
        - conditions:
          - condition: template
            value_template: "{{ states('sensor.thermometer_buro_matthias_temperatur')
              | float(0)\n   < states('input_number.soll_temperatur') | float(0) }}\n"
          sequence:
          - target:
              entity_id: switch.heizung_buro_matthias
            action: switch.turn_on
        - conditions:
          - condition: template
            value_template: "{{ states('sensor.thermometer_buro_matthias_temperatur')
              | float(0)\n   >= states('input_number.soll_temperatur') | float(0)
              }}\n"
          sequence:
          - target:
              entity_id: switch.heizung_buro_matthias
            action: switch.turn_off
    - conditions:
      - condition: template
        value_template: "{{ not (\n   now() >= today_at(states('input_datetime.heizung_buro_matthias_an'))
          and\n   now() <  today_at(states('input_datetime.heizung_buro_matthias_aus'))\n)
          }}\n"
      sequence:
      - target:
          entity_id: switch.heizung_buro_matthias
        action: switch.turn_off
  mode: single
- id: lounge_offset_sync_stefaniya
  alias: Synchronisiere Temperatur-Offset Lounge (Stefaniya)
  description: 'Setzt den Bosch-Offset absolut korrekt basierend auf der Differenz
    zwischen Sonoff (Master) und Bosch (Slave-Anzeige).

    '
  trigger:
  - platform: state
    entity_id:
    - sensor.thermometer_buro_stefaniya_temperatur
    - sensor.raumth_lounge_temperature
  condition:
  - condition: template
    value_template: '{% set master = states(''sensor.thermometer_buro_stefaniya_temperatur'')
      | float(999) %} {% set slave  = states(''sensor.raumth_lounge_temperature'')
      | float(999) %} {% set current_offset = states(''number.raumth_lounge_offset'')
      | float(999) %}

      {{ master != 999 and slave != 999 and current_offset != (slave - master) }}

      '
  action:
  - service: number.set_value
    target:
      entity_id: number.raumth_lounge_offset
    data:
      value: '{% set master = states(''sensor.thermometer_buro_stefaniya_temperatur'')
        | float(0) %} {% set slave  = states(''sensor.raumth_lounge_temperature'')
        | float(0) %}

        {% set offset = master - slave %}

        {# Begrenzen auf Bosch-Grenzen #} {% set limited = [5.0, [-5.0, offset] |
        max] | min %}

        {# Auf 0.1-Schritte runden #} {{ (limited / 0.1) | round(0) * 0.1 }}

        '
  mode: single
- id: lounge_heizen_master_toggle
  alias: UG Lounge Heizen basierend auf Master-Ist (Büro Stefaniya) und Bosch-Soll
    (Lounge) Toggle Skript
  trigger:
  - platform: state
    entity_id: sensor.thermometer_buro_stefaniya_temperatur
  - platform: state
    entity_id: climate.raumkl_lounge
  - platform: time_pattern
    minutes: /5
    seconds: 30
  action:
  - variables:
      ist: '{{ states(''sensor.thermometer_buro_stefaniya_temperatur'') | float }}'
      soll: '{{ state_attr(''climate.raumkl_lounge'', ''temperature'') | float }}'
      preset: '{{ state_attr(''climate.raumkl_lounge'', ''preset_mode'') }}'
      mode: '{{ states(''climate.raumkl_lounge'') }}'
  - choose:
    - conditions: '{{ mode != ''auto'' }}'
      sequence:
      - service: climate.set_hvac_mode
        target:
          entity_id: climate.raumkl_lounge
        data:
          hvac_mode: auto
  - choose:
    - conditions: '{{ ist < soll and preset != ''none'' }}'
      sequence:
      - service: climate.set_preset_mode
        target:
          entity_id: climate.raumkl_lounge
        data:
          preset_mode: none
    default:
    - choose:
      - conditions: '{{ ist >= soll and preset != ''eco'' }}'
        sequence:
        - service: climate.set_preset_mode
          target:
            entity_id: climate.raumkl_lounge
          data:
            preset_mode: eco
  mode: single
- id: '1768423840938'
  alias: Lounge Heizung – Master-driven Control (final)
  triggers:
  - seconds: /30
    trigger: time_pattern
  conditions:
  - '{{ ist > 0 and soll > 0 }}

    '
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ delta < -0.3 and current_mode != ''heat'' }}'
      sequence:
      - target:
          entity_id: climate.raumkl_lounge
        data:
          hvac_mode: heat
        action: climate.set_hvac_mode
    - conditions:
      - condition: template
        value_template: '{{ delta > 0.3 and current_mode != ''auto'' }}'
      sequence:
      - target:
          entity_id: climate.raumkl_lounge
        data:
          hvac_mode: auto
        action: climate.set_hvac_mode
  mode: single
  variables:
    ist: '{{ states(''sensor.thermometer_buro_stefaniya_temperatur'') | float(0) }}'
    soll: '{{ state_attr(''climate.raumkl_lounge'', ''temperature'') | float(0) }}'
    delta: '{{ ist - soll }}'
    current_mode: '{{ state_attr(''climate.raumkl_lounge'', ''hvac_mode'') or states(''climate.raumkl_lounge'')
      }}'
- id: '1768497596890'
  alias: Synchronisiere Temperatur-Offset Lounge
  description: Automatisierung zur Anpassung des Offsets basierend auf den Sensorwerten.
  triggers:
  - entity_id:
    - sensor.thermometer_buro_stefaniya_temperatur
    - sensor.raumth_lounge_temperature
    trigger: state
  conditions:
  - condition: template
    value_template: "{{ states('sensor.thermometer_buro_stefaniya_temperatur') | float
      !=\n   states('sensor.raumth_lounge_temperature') | float }}\n"
  actions:
  - target:
      entity_id:
      - number.raumth_lounge_offset
    data:
      value: "{{ (states('number.raumth_lounge_offset') | float +\n    (states('sensor.thermometer_buro_stefaniya_temperatur')
        | float -\n     states('sensor.raumth_lounge_temperature') | float)) | round(2)
        }}\n"
    action: number.set_value
  mode: single
- id: '1769418946831'
  alias: Stehlampe 1 morgens aus (Mo–Fr)
  description: ''
  triggers:
  - event: sunrise
    trigger: sun
  - at: 08:30:00
    trigger: time
  conditions:
  - condition: time
    weekday:
    - mon
    - tue
    - wed
    - thu
    - fri
  actions:
  - target:
      entity_id: switch.stehlampe_1_schalter
    action: switch.turn_off
  mode: single
- id: '1793646697253'
  alias: Heizung Büro Matthias Automatisierung Dynamisch
  triggers:
  - at: sensor.heizung_startzeit_berechnet_buro_matthias
    trigger: time
  - at: sensor.heizung_stoppzeit_berechnet_buro_matthias
    trigger: time
  - entity_id: sensor.thermometer_buro_matthias_temperatur
    trigger: state
  - entity_id: input_number.soll_temperatur
    trigger: state
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{% set now_time = now().strftime(''%H:%M:%S'') %} {% set
          start_time = states(''sensor.heizung_startzeit_berechnet_buro_matthias'')
          %} {% set stop_time = states(''sensor.heizung_stoppzeit_berechnet_buro_matthias'')
          %} {{ start_time <= now_time <= stop_time }}'
      - condition: template
        value_template: '{{ states(''sensor.thermometer_buro_matthias_temperatur'')
          | float(0) < states(''input_number.soll_temperatur'') | float(0) }}'
      sequence:
      - target:
          entity_id: switch.heizung_buro_matthias
        action: switch.turn_on
    - conditions:
      - condition: template
        value_template: '{% set absenk_temp = 17.5 %} {{ states(''sensor.thermometer_buro_matthias_temperatur'')
          | float(0) < absenk_temp }}'
      sequence:
      - target:
          entity_id: switch.heizung_buro_matthias
        action: switch.turn_on
    default:
    - target:
        entity_id: switch.heizung_buro_matthias
      action: switch.turn_off
