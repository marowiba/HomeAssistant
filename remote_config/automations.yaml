- id: b1a4754f55cf41b8970c892209db9220
  alias: Synchronisiere Temperatur-Offset Schlafzimmer
  description: Automatisierung zur Anpassung des Offsets basierend auf den Sensorwerten.
  triggers:
  - entity_id:
    - sensor.somneo_temperature
    - sensor.raumth_schlafzimmer_temperature
    trigger: state
  conditions:
  - condition: template
    value_template: '{{ states(''sensor.somneo_temperature'') | float != states(''sensor.raumth_schlafzimmer_temperature'')
      | float }}

      '
  actions:
  - target:
      entity_id: number.raumth_schlafzimmer_offset
    data:
      value: "{{ (states('number.raumth_schlafzimmer_offset') | float + \n   (states('sensor.somneo_temperature')
        | float - states('sensor.raumth_schlafzimmer_temperature') | float)) | round(2)
        }}\n"
    action: number.set_value
  mode: single
